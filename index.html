<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c18">
<title>Moonshot — Gravity Puzzle</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./game.mjs"></script>
</head>
<body>
<main>
  <header>
    <div class="identity"><span class="logo" aria-hidden="true">◐</span><h1>Moonshot</h1></div>
    <div class="actions"><button id="fullscreen" type="button" hidden>Fullscreen</button><button id="restart" type="button">↻ <span>Restart</span></button></div>
  </header>
  <section aria-labelledby="level-name">
    <div class="level-header"><div><p id="level-number" class="label"></p><h2 id="level-name"></h2></div><p id="shots" class="label"></p></div>
    <div class="viewport">
      <canvas id="space" width="1800" height="1040" tabindex="0" aria-label="Moonshot playfield" aria-describedby="controls"></canvas>
      <button id="next" type="button" hidden>Next level</button>
    </div>
    <div class="readout"><p id="status" role="status">Pull back the probe and release.</p><span id="power" class="label"></span></div>
  </section>
  <div class="rotate"><p>Rotate to landscape</p><small>Turn your device sideways to play.</small></div>
  <p id="controls">Drag the probe to aim. With a keyboard, use arrow keys to aim and set power, then Space to launch.</p>
</main>
</body>
</html>
